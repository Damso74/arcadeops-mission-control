name: Submission CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: submission-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mcp_server/package-lock.json

      - name: Run workflow tests
        run: python runner/test_submission_workflow.py -v

      - name: Install MCP dependencies
        working-directory: mcp_server
        run: npm ci

      - name: Run MCP black-box tests
        working-directory: mcp_server
        run: npm test

      - name: Audit production dependencies
        working-directory: mcp_server
        run: npm audit --omit=dev --audit-level=high
