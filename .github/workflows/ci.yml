name: Submission CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: submission-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            mcp_server/package-lock.json
            demo_assets/package-lock.json

      - name: Run workflow and Evidence Console tests
        run: python -m unittest discover -s runner -p "test_*.py" -v

      - name: Install MCP dependencies
        working-directory: mcp_server
        run: npm ci

      - name: Run MCP black-box tests
        working-directory: mcp_server
        run: npm test

      - name: Audit production dependencies
        working-directory: mcp_server
        run: npm audit --omit=dev --audit-level=high

      - name: Validate portable demo tooling
        working-directory: demo_assets
        run: |
          npm ci --ignore-scripts
          node --check preview_video.mjs
          node --check render_video.mjs
          node --check verify_video.mjs
          node --check verify_console.mjs
          npm audit --audit-level=high

      - name: Verify rendered Authority Ledger
        working-directory: demo_assets
        run: |
          npx playwright install --with-deps chromium
          cd ..
          python -m http.server 4173 --bind 127.0.0.1 >/tmp/arcadeops-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          node demo_assets/verify_console.mjs
