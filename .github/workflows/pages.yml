name: Publish Evidence Console

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify the published Evidence Receipt
        run: node --test evidence_console/test_receipt_validator.mjs evidence_console/test_arcadeops_cli.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build minimal public site
        run: |
          mkdir -p _site/evidence _site/schemas
          cp -R evidence_console _site/evidence_console
          cp evidence/submission-evidence-receipt.json _site/evidence/
          cp evidence/go-pivot-evidence-receipt.json _site/evidence/
          cp schemas/arcadeops-receipt-v2.1.0.schema.json _site/schemas/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
