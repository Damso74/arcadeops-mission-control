name: trueforge-governed-pivot

services:
  governed-operations:
    build:
      context: ./mcp_server
    image: trueforge-governed-mcp:local
    container_name: trueforge-governed-mcp-20260824
    restart: unless-stopped
    environment:
      PORT: "8765"
      STATE_PATH: /data/records.json
      MCP_AUTH_TOKEN: ${TRUEFORGE_MCP_AUTH_TOKEN:?TRUEFORGE_MCP_AUTH_TOKEN must be set}
    volumes:
      - governed-mcp-state:/data
    networks:
      - trueforge
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8765/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  governed-mcp-state:
    external: true
    name: trueforge-governed-mcp-state

networks:
  trueforge:
    external: true
    name: trueforge_default
